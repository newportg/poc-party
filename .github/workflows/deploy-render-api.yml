name: Deploy Companies House API to Render

on:
  push:
    branches:
      - master
    paths:
      - "api/**"
      - "render.yaml"
      - ".github/workflows/deploy-render-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install -r requirements.txt

      - name: Run API tests
        run: python -m unittest -v

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL repository secret to the Render service deploy hook URL."
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" --request POST "$RENDER_DEPLOY_HOOK_URL")
          case "$status" in
            2??) echo "Render accepted the deployment request (HTTP $status)." ;;
            *) echo "::error::Render deployment hook failed (HTTP $status)."; exit 1 ;;
          esac
